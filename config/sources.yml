user_agent: "research-collection-radar/0.1 (+https://github.com/hideh1231/research-collection-radar; academic metadata index)"
timeout_seconds: 40
max_pages: 40

sources:
  - key: nature-psychology
    enabled: true
    collector: nature
    publisher: Nature Portfolio
    journal: Scientific Reports
    collection_type: collection
    url: "https://www.nature.com/srep/calls-for-papers?subject=Psychology"
    allowed_hosts:
      - www.nature.com
      - nature.com
  - key: nature-comms-psychology
    enabled: true
    collector: nature
    publisher: Nature Portfolio
    journal: Communications Psychology
    collection_type: collection
    url: "https://www.nature.com/commspsychol/calls-for-papers"
    allowed_hosts:
      - www.nature.com
      - nature.com
  - key: frontiers-psychology
    enabled: true
    collector: frontiers
    publisher: Frontiers
    journal: Frontiers in Psychology
    collection_type: research_topic
    url: "https://www.frontiersin.org/journals/psychology/research-topics"
    allowed_hosts:
      - www.frontiersin.org
      - frontiersin.org
    max_pages: 200
    deadline_enrichment: &frontiers_detail
      daily_limit: 200
      min_interval_seconds: 1
      listed_recheck_days: 7
      not_listed_recheck_days: 30
      checkpoint_size: 25
  - key: frontiers-robotics-ai
    enabled: true
    collector: frontiers
    publisher: Frontiers
    journal: Frontiers in Robotics and AI
    collection_type: research_topic
    url: "https://www.frontiersin.org/journals/robotics-and-ai/research-topics"
    allowed_hosts:
      - www.frontiersin.org
      - frontiersin.org
    max_pages: 200
    deadline_enrichment: *frontiers_detail
