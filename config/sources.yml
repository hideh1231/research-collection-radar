  - key: sciencedirect-cfp
    enabled: false
    collector: sciencedirect
    publisher: Elsevier
    journal: ScienceDirect
    collection_type: special_issue
    url: "https://www.sciencedirect.com/browse/calls-for-papers"
    require_domains: true
    scope_pattern: "psycholog|psychiatr|neuroscien|neuropsych|neuroimaging|\\bbrain\\b|robot|human-computer|human–computer|human-robot|\\bcognition\\b|\\bhci\\b|\\bhri\\b"
    allowed_hosts:
      - www.sciencedirect.com
      - sciencedirect.com
    disabled_reason: "GitHub Actions GET returns 403; ingest a rendered browse listing with python -m radar --ingest-html sciencedirect-cfp=listing.html. Do not crawl special-issue detail pages."
  - key: springer-bmc-psychology
    enabled: true
    collector: springer
    publisher: Springer Nature
    journal: BMC Psychology
    collection_type: collection
    url: "https://bmcpsychology.biomedcentral.com/articles/collections"
    allowed_hosts:
      - bmcpsychology.biomedcentral.com
      - www.biomedcentral.com
  - key: springer-bmc-psychiatry
    enabled: true
    collector: springer
    publisher: Springer Nature
    journal: BMC Psychiatry
    collection_type: collection
    url: "https://bmcpsychiatry.biomedcentral.com/articles/collections"
    allowed_hosts:
      - bmcpsychiatry.biomedcentral.com
      - www.biomedcentral.com
  - key: springer-jner
    enabled: true
    collector: springer
    publisher: Springer Nature
    journal: Journal of NeuroEngineering and Rehabilitation
    collection_type: collection
    url: "https://jneuroengrehab.biomedcentral.com/articles/collections"
    allowed_hosts:
      - jneuroengrehab.biomedcentral.com
      - www.biomedcentral.com
  - key: apa-cfp
    enabled: false
    collector: apa
    publisher: APA
    journal: APA Journals
    collection_type: special_issue
    url: "https://www.apa.org/pubs/journals/resources/calls-for-papers"
    allowed_hosts:
      - www.apa.org
      - apa.org
    disabled_reason: "GitHub Actions GET returns Incapsula; ingest the official listing HTML with python -m radar --ingest-html apa-cfp=listing.html. Detail pages are not required."
  - key: royal-society-rsos
    enabled: false
    collector: royal_society
    publisher: The Royal Society
    journal: Royal Society Open Science
    collection_type: special_collection
    url: "https://royalsocietypublishing.org/rsos/collection"
    allowed_hosts:
      - royalsocietypublishing.org
      - royalsociety.org
    disabled_reason: "Publishing platform returns Cloudflare 403. Use royal-society-themes on royalsociety.org instead."
  - key: royal-society-themes
    enabled: false
    collector: royal_society
    publisher: The Royal Society
    journal: Royal Society
    collection_type: special_collection
    url: "https://royalsociety.org/journals/publishing-activities/journal-article-collections/ai/"
    urls:
      - "https://royalsociety.org/journals/publishing-activities/journal-article-collections/ai/"
      - "https://royalsociety.org/journals/publishing-activities/journal-article-collections/cell-mol-bio/"
    allowed_hosts:
      - royalsociety.org
      - royalsocietypublishing.org
    disabled_reason: "Listing is parseable from royalsociety.org theme pages. Keep disabled in GitHub Actions until a scheduled run returns 200 without a WAF page; ingest saved HTML with --ingest-html royal-society-themes=page.html."
  - key: plos-collections
    enabled: true
    collector: plos
    publisher: PLOS
    journal: PLOS
    collection_type: collection
    url: "https://collections.plos.org/calls-for-papers/"
    api_url: "https://collections.plos.org/wp-json/wp/v2/call_for_papers"
    allowed_hosts:
      - collections.plos.org
      - plos.org
      - www.plos.org
    max_pages: 20
