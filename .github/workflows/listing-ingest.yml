name: Ingest listing sources

on:
  schedule:
    - cron: "47 21 * * 1"
  workflow_dispatch:
    inputs:
      apa_html_url:
        description: Optional HTTPS URL of a rendered APA listing HTML snapshot
        required: false
        type: string
      sciencedirect_html_url:
        description: Optional HTTPS URL of a rendered ScienceDirect listing HTML snapshot
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ${{ vars.LISTING_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[listing]"
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - name: Render listing HTML in Chrome
        env:
          APA_HTML_URL: ${{ inputs.apa_html_url }}
          SCIENCEDIRECT_HTML_URL: ${{ inputs.sciencedirect_html_url }}
        run: |
          set -euo pipefail
          mkdir -p listing-html
          only=()
          if [ -z "${APA_HTML_URL:-}" ]; then
            only+=(--only apa-cfp)
          fi
          if [ -z "${SCIENCEDIRECT_HTML_URL:-}" ]; then
            only+=(--only sciencedirect-cfp)
          fi
          if [ ${#only[@]} -eq 0 ]; then
            echo "snapshot URLs provided for every listing; skip browser render"
            exit 0
          fi
          xvfb-run --auto-servernum python -m radar --render-listings --out-dir listing-html "${only[@]}"
      - name: Upload listing HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: listing-html
          path: listing-html
          if-no-files-found: ignore
      - name: Ingest rendered listings
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          APA_HTML_URL: ${{ inputs.apa_html_url }}
          SCIENCEDIRECT_HTML_URL: ${{ inputs.sciencedirect_html_url }}
        run: |
          set -euo pipefail
          args=()
          if [ -f listing-html/status.json ]; then
            args+=(--ingest-rendered listing-html)
          fi
          if [ -n "${APA_HTML_URL:-}" ]; then
            args+=(--ingest-html "apa-cfp=${APA_HTML_URL}")
          fi
          if [ -n "${SCIENCEDIRECT_HTML_URL:-}" ]; then
            args+=(--ingest-html "sciencedirect-cfp=${SCIENCEDIRECT_HTML_URL}")
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "no listing HTML to ingest"
            exit 0
          fi
          python -m radar --open-only "${args[@]}"
