name: Ingest listing sources

on:
  schedule:
    - cron: "47 21 * * 1"
  workflow_dispatch:
    inputs:
      apa_html_url:
        description: HTTPS URL of a rendered APA calls-for-papers HTML snapshot
        required: false
        type: string
      sciencedirect_html_url:
        description: HTTPS URL of a rendered ScienceDirect browse HTML snapshot
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ${{ vars.LISTING_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Fetch APA listing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.apa_html_url == '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python -m radar --include-disabled --open-only --only apa-cfp
      - name: Ingest listing snapshots
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.apa_html_url != '' || inputs.sciencedirect_html_url != '') }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          APA_HTML_URL: ${{ inputs.apa_html_url }}
          SCIENCEDIRECT_HTML_URL: ${{ inputs.sciencedirect_html_url }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${APA_HTML_URL:-}" ]; then
            args+=(--ingest-html "apa-cfp=${APA_HTML_URL}")
          fi
          if [ -n "${SCIENCEDIRECT_HTML_URL:-}" ]; then
            args+=(--ingest-html "sciencedirect-cfp=${SCIENCEDIRECT_HTML_URL}")
          fi
          python -m radar --open-only "${args[@]}"
