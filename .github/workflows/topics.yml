name: Enrich research topics

on:
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum open records to enrich
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Enrich topics
        env:
          RADAR_LLM_BASE_URL: ${{ secrets.RADAR_LLM_BASE_URL }}
          RADAR_LLM_API_KEY: ${{ secrets.RADAR_LLM_API_KEY }}
          RADAR_LLM_MODEL: ${{ secrets.RADAR_LLM_MODEL }}
          RADAR_LLM_LIMIT: ${{ github.event.inputs.limit }}
        run: python -m radar --enrich-topics
