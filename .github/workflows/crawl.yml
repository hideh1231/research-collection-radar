name: Crawl research collections

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without Slack delivery or committing crawl data"
        type: boolean
        default: false
      source_keys:
        description: "Space-separated source keys for validation; blank checks all enabled sources"
        type: string
        default: ""
      check_deadlines_only:
        description: "Check pending collection detail pages only"
        type: boolean
        default: false
      check_frontiers_only:
        description: "Check all due Frontiers details only; preserve unavailable pages as pending"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config/sources.yml
      - config/journals.yml
      - .github/workflows/crawl.yml

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Queued writers need the latest branch data; validation stays pinned.
          ref: ${{ inputs.dry_run && github.sha || github.ref }}
          persist-credentials: ${{ !inputs.dry_run }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Crawl
        if: ${{ !inputs.dry_run && !inputs.check_deadlines_only && !inputs.check_frontiers_only }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python -m radar
      - name: Validate crawl without delivery
        if: ${{ inputs.dry_run && !inputs.check_deadlines_only && !inputs.check_frontiers_only }}
        env:
          RADAR_SOURCE_KEYS: ${{ inputs.source_keys }}
        run: |
          args=(--dry-run)
          read -r -a sources <<< "$RADAR_SOURCE_KEYS"
          for source in "${sources[@]}"; do
            args+=(--only "$source")
          done
          python -m radar "${args[@]}"
      - name: Verify collection deadlines
        if: ${{ !inputs.check_frontiers_only && (!inputs.dry_run || inputs.check_deadlines_only) }}
        env:
          RADAR_DRY_RUN: ${{ inputs.dry_run }}
          RADAR_SOURCE_KEYS: ${{ inputs.source_keys }}
        run: |
          args=(--check-deadlines)
          if [[ "$RADAR_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          read -r -a sources <<< "$RADAR_SOURCE_KEYS"
          for source in "${sources[@]}"; do args+=(--only "$source"); done
          python -m radar "${args[@]}"
      - name: Verify Frontiers details
        if: ${{ inputs.check_frontiers_only }}
        env:
          RADAR_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--check-frontiers --limit 10000)
          if [[ "$RADAR_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m radar "${args[@]}"
      - name: Summarize saved collection health
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("data/source_status.json")
          if path.exists():
              state = json.loads(path.read_text())
              detail = state.get("frontiers_detail", {}).get("deadline_enrichment", {})
              checks = state.get("collection_deadline_checks", {})
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("### Saved collection health\n\n")
                  out.write(f"Listing snapshot: {state.get('checked_at', 'unknown')}\n\n")
                  out.write(f"Frontiers details: {detail.get('checked', 0)} checked, "
                            f"{detail.get('failed', 0)} failed, {detail.get('remaining', 0)} pending "
                            f"(snapshot: {detail.get('checked_at', 'unknown')}).\n\n")
                  out.write(f"Other collection details: {checks.get('checked', 0)} checked, "
                            f"{len(checks.get('errors', {}))} failed, {checks.get('remaining', 0)} pending "
                            f"(snapshot: {checks.get('checked_at', 'unknown')}).\n\n")
                  out.write("A successful listing crawl does not imply every detail page was verified. "
                            "Unavailable pages retain their previous deadline state. "
                            "See data/source_status.json for exact URL errors.\n")
          PY
      - name: Save validation report
        if: ${{ always() && (inputs.dry_run || inputs.check_frontiers_only) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawl-validation
          path: |
            data/source_status.json
            OPEN.md
          retention-days: 7
