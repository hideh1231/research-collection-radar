name: Crawl research collections

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without Slack delivery or committing crawl data"
        type: boolean
        default: false
      source_keys:
        description: "Space-separated source keys for validation; blank checks all enabled sources"
        type: string
        default: ""
      check_deadlines_only:
        description: "Check pending collection detail pages only"
        type: boolean
        default: false
      check_frontiers_only:
        description: "Check all due Frontiers details only; preserve unavailable pages as pending"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - config/sources.yml
      - config/journals.yml
      - .github/workflows/crawl.yml

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Queued writers need the latest branch data; validation stays pinned.
          ref: ${{ inputs.dry_run && github.sha || github.ref }}
          persist-credentials: ${{ !inputs.dry_run }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe publisher responses
        if: ${{ inputs.dry_run }}
        run: python publisher_probe.py
