name: Crawl research collections

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without Slack delivery or committing crawl data"
        type: boolean
        default: false
      source_keys:
        description: "Space-separated source keys for validation; blank checks all enabled sources"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - config/sources.yml
      - config/journals.yml
      - .github/workflows/crawl.yml

permissions:
  contents: write

concurrency:
  group: research-collection-radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Queued writers need the latest branch data; validation stays pinned.
          ref: ${{ inputs.dry_run && github.sha || github.ref }}
          persist-credentials: ${{ !inputs.dry_run }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Crawl
        if: ${{ !inputs.dry_run }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python -m radar
      - name: Validate crawl without delivery
        if: ${{ inputs.dry_run }}
        env:
          RADAR_SOURCE_KEYS: ${{ inputs.source_keys }}
        run: |
          args=(--dry-run)
          read -r -a sources <<< "$RADAR_SOURCE_KEYS"
          for source in "${sources[@]}"; do
            args+=(--only "$source")
          done
          python -m radar "${args[@]}"
      - name: Save validation report
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawl-validation
          path: |
            data/source_status.json
            OPEN.md
          retention-days: 7
